[pytest]
testpaths = e2e/tests

# The four scenarios build on each other's data, so the file order is the run
# order. Numbered file names make that order explicit rather than incidental.
python_files = test_*.py

addopts =
    -v
    --strict-markers
    --tb=short

markers =
    e2e: an end-to-end scenario driven through a real browser
